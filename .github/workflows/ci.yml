name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Une seule exécution par branche : les runs obsolètes sont annulés (green code).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache des dépendances
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Installation
        run: bun install --frozen-lockfile

      - name: Vérification des types
        run: bun run check

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build
