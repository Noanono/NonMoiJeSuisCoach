name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Une seule exécution par branche : les runs obsolètes sont annulés (green code),
# sauf sur main pour ne jamais couper une mise en production en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  qualite:
    name: Types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache des dépendances
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Installation
        run: bun install --frozen-lockfile

      - name: Vérification des types
        run: bun run check

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Publication du build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploiement:
    name: Mise en production (Netlify)
    needs: qualite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    # Un déploiement en cours n'est jamais interrompu par un push suivant.
    concurrency:
      group: netlify-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: oven-sh/setup-bun@v2

      - name: Déploiement
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bunx netlify-cli deploy --prod --no-build --dir=dist \
            --message "${{ github.sha }}" --json > deploy.json
          echo "url=$(jq -r '.url' deploy.json)" >> "$GITHUB_OUTPUT"

  release:
    name: Tag et release
    needs: deploiement
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Les releases sont créées l'une après l'autre pour ne jamais calculer deux fois le même numéro.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version sémantique déduite des commits conventionnels depuis le dernier tag :
      # changement cassant -> majeure, feat -> mineure, le reste -> correctif.
      # Le tout premier tag reprend la version de package.json.
      - name: Calcul de la version
        id: version
        run: |
          dernier=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$dernier" ]; then
            suivante="v$(jq -r '.version' package.json)"
          else
            commits=$(git log "$dernier"..HEAD --format='%s%n%b')
            IFS=. read -r majeure mineure correctif <<< "${dernier#v}"
            if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<< "$commits"; then
              suivante="v$((majeure + 1)).0.0"
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$commits"; then
              suivante="v${majeure}.$((mineure + 1)).0"
            else
              suivante="v${majeure}.${mineure}.$((correctif + 1))"
            fi
          fi
          echo "Version : $suivante (précédente : ${dernier:-aucune})"
          echo "tag=$suivante" >> "$GITHUB_OUTPUT"

      - name: Création du tag et de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
